<title>SEMGrainMapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: instrument console — micrograph viewport (always dark, like an SEM monitor) left, parameter/result rail right */
[hidden] { display: none !important; }
:root {
  --bg: #f3f4f2;
  --panel: #fbfbfa;
  --line: #d9dcd6;
  --fg: #16191a;
  --fg2: #4d5452;
  --muted: #7d8481;
  --accent: #1f6f8b;
  --accent-fg: #ffffff;
  --accent-soft: #dcebf0;
  --gb: #ffb21a;
  --stage: #0d0f10;
  --stage-fg: #e9ecea;
  --warn: #b25e00;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-disp: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121516; --panel: #191d1e; --line: #2c3334; --fg: #e8ecea; --fg2: #b4bcb9; --muted: #838c89;
  --accent: #4fb0cf; --accent-fg: #0c1416; --accent-soft: #1b3640; --gb: #ffb21a; --stage: #08090a; --stage-fg: #e9ecea; --warn: #e89a3c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121516; --panel: #191d1e; --line: #2c3334; --fg: #e8ecea; --fg2: #b4bcb9; --muted: #838c89;
  --accent: #4fb0cf; --accent-fg: #0c1416; --accent-soft: #1b3640; --gb: #ffb21a; --stage: #08090a; --stage-fg: #e9ecea; --warn: #e89a3c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font-ui); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-inline: 16px; padding-block: 10px 14px; gap: 10px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }
.mark { font: 600 20px/1 var(--font-disp); letter-spacing: .01em; }
.mark span { color: var(--accent); }
.databar { font: 12px var(--font-mono); color: var(--fg2); display: flex; gap: 12px; flex-wrap: wrap; min-width: 0; }
.databar b { font-weight: 500; color: var(--fg); }
.status { margin-left: auto; font: 12px var(--font-mono); padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.status.busy { background: var(--fg); color: var(--bg); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; min-height: 0; }

/* viewer */
.stage { position: relative; background: var(--stage); border-radius: 6px; overflow: hidden; min-height: 420px; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tools { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
.tools button { width: 40px; height: 34px; border: 1px solid #2b3133; background: rgba(20,23,24,.86); color: var(--stage-fg); border-radius: 5px; cursor: pointer; font: 500 11px var(--font-mono); position: relative; }
.tools button:hover { border-color: #56605f; }
.tools button[aria-pressed="true"] { background: var(--gb); color: #141414; border-color: var(--gb); }
.tools .sep { height: 6px; }
.tools button .k { position: absolute; right: 2px; bottom: 0; font-size: 8px; opacity: .6; }
.viewbar { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; z-index: 3; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid #2b3133; border-radius: 5px; overflow: hidden; background: rgba(20,23,24,.86); }
.seg button { border: 0; background: transparent; color: #aeb6b3; padding: 6px 9px; cursor: pointer; font: 500 11px var(--font-mono); }
.seg button[aria-pressed="true"] { background: #e9ecea; color: #111; }
.card .seg button { color: var(--fg2); }
.card .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.hud { position: absolute; left: 60px; bottom: 10px; right: 10px; display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; pointer-events: none; z-index: 3; }
.hud .hint { font: 11px var(--font-mono); color: #aeb6b3; background: rgba(13,15,16,.8); padding: 4px 8px; border-radius: 4px; }
.tip { position: absolute; z-index: 4; pointer-events: none; background: rgba(13,15,16,.92); color: #e9ecea; font: 11px/1.5 var(--font-mono); padding: 6px 8px; border-radius: 4px; border: 1px solid #353c3e; white-space: nowrap; }
.drop { position: absolute; inset: 0; border: 2px dashed var(--gb); background: rgba(255,178,26,.08); display: grid; place-items: center; color: var(--gb); font: 500 14px var(--font-mono); z-index: 5; }

/* rail */
.rail { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.card h2 { margin: 0; font: 600 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); display: flex; align-items: center; gap: 8px; }
.card h2 .r { margin-left: auto; text-transform: none; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.row { display: grid; grid-template-columns: 96px minmax(0,1fr) 56px; align-items: center; gap: 8px; }
.row label { color: var(--fg2); font-size: 12px; }
.row output, .row .u { font: 12px var(--font-mono); color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=number], input[type=text], select { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font: 12px var(--font-mono); }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--bg); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn:hover { border-color: var(--fg2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:disabled { opacity: .45; cursor: default; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg2); }
.chk input { accent-color: var(--accent); }
.sub { font-size: 11.5px; color: var(--muted); margin: 0; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.kpi { background: var(--panel); padding: 7px 8px; min-width: 0; }
.kpi .l { font: 10.5px var(--font-mono); color: var(--muted); letter-spacing: .02em; }
.kpi .v { font: 500 15px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .v small { font-size: 10.5px; color: var(--muted); font-weight: 400; }
.gt { font: 11.5px var(--font-mono); color: var(--fg2); background: var(--accent-soft); border-radius: 4px; padding: 5px 8px; }
.chart { position: relative; width: 100%; }
.chart { flex: none; }
.chart canvas { width: 100%; display: block; }
.axis { display: grid; grid-template-columns: auto minmax(0,1fr) auto minmax(0,1fr); gap: 6px 8px; align-items: center; font-size: 12px; color: var(--fg2); }
.axis input { padding: 4px 6px; }
.cmp { width: 100%; border-collapse: collapse; font: 11.5px var(--font-mono); font-variant-numeric: tabular-nums; }
.cmp td, .cmp th { padding: 4px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.cmp th { color: var(--muted); font-weight: 400; }
.cmp td:first-child, .cmp th:first-child { text-align: left; }
.chip { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
.tbl { overflow-x: auto; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 5px; font-size: 12.5px; z-index: 20; max-width: calc(100% - 32px); }
@media (max-width: 900px) {
  .app { height: auto; }
  .main { grid-template-columns: minmax(0,1fr); }
  .stage { height: 62vh; min-height: 360px; }
  .rail { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <div class="mark">SEM<span>Grain</span>Mapper</div>
    <div class="databar" id="databar"></div>
    <div class="status" id="status">Ready</div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="tools" id="tools">
        <button data-tool="pan" title="Pan (V)">PAN<span class="k">V</span></button>
        <button data-tool="roi" title="ROI 지정 (R)">ROI<span class="k">R</span></button>
        <button data-tool="scale" title="Scale line (S)">SCL<span class="k">S</span></button>
        <div class="sep"></div>
        <button data-tool="draw" title="Boundary 그리기 (B)">+GB<span class="k">B</span></button>
        <button data-tool="erase" title="Boundary 지우기 (E)">−GB<span class="k">E</span></button>
        <button data-tool="seed" title="Seed 추가 = grain split (A)">SEED<span class="k">A</span></button>
        <button data-tool="merge" title="두 grain 병합 (M)">MRG<span class="k">M</span></button>
        <div class="sep"></div>
        <button id="undo" title="Undo (Ctrl+Z)">UNDO</button>
        <button id="fit" title="Fit (F)">FIT</button>
      </div>
      <div class="viewbar">
        <div class="seg" id="vmode">
          <button data-v="image">IMAGE</button>
          <button data-v="overlay">GB</button>
          <button data-v="grains">GRAIN</button>
          <button data-v="ridge">RIDGE</button>
        </div>
      </div>
      <div class="hud"><span class="hint" id="hint"></span><span class="hint" id="zoomlbl"></span></div>
      <div class="tip" id="tip" hidden></div>
      <div class="drop" id="drop" hidden>이미지를 놓으십시오 (TIF · PNG · JPG + Hitachi .txt)</div>
    </div>

    <aside class="rail">
      <section class="card">
        <h2>Source <span class="r" id="srcname"></span></h2>
        <div class="btns">
          <button class="btn pri" id="openBtn">Open image…</button>
          <button class="btn" id="sampleBtn">Synthetic sample</button>
          <button class="btn pri" id="procBtn" style="margin-left:auto">Process</button>
          <input type="file" id="file" accept=".tif,.tiff,.png,.jpg,.jpeg,.bmp,.txt" multiple hidden>
        </div>
        <div class="row"><label for="nmpx">Pixel size</label><input type="number" id="nmpx" step="0.001" min="0.001"><span class="u">nm/px</span></div>
        <div class="row"><label for="barlen" title="이미지 하단에 적힌 scale bar 값 (예: 2.00um, 5.00um)">Scale bar</label><input type="number" id="barlen" step="0.01" min="0.001" value="2.00"><span class="u">µm</span></div>
        <div class="btns">
          <button class="btn" id="detectBtn">Detect ticks</button>
          <button class="btn" id="applyLineBtn" disabled>Apply scale line</button>
        </div>
        <p class="sub" id="scaleinfo"></p>
      </section>

      <section class="card">
        <h2>Detection <button class="btn" id="autoBtn" style="margin-left:auto;padding:3px 9px;font:500 11px var(--font-mono);letter-spacing:.04em" title="이미지 로드 시 기본값으로 되돌립니다">AUTO</button></h2>
        <div class="row"><label for="mode" title="Line: 경계가 선(crack/groove)으로 보임 · Contrast: grain마다 밝기가 달라 명암 차로 구분">GB type</label>
          <select id="mode"><option value="line">Line · 선 경계</option><option value="contrast">Contrast · 명암 차</option></select><span></span></div>
        <label class="chk" id="destripeRow" hidden><input type="checkbox" id="destripe" checked> Scan-line noise 제거</label>
        <div class="row"><label for="pol">GB tone</label>
          <select id="pol"><option value="dark">어두운 선 (Dark)</option><option value="bright">밝은 선 (Bright)</option><option value="both">둘 다 (Both)</option></select><span></span></div>
        <div class="row"><label for="fres">Calc scale</label>
          <select id="fres"><option value="1">1/1 · 정밀</option><option value="2">1/2 · 기본</option><option value="4">1/4 · 빠름</option></select><span></span></div>
        <div class="row"><label for="sigma" title="검출할 경계선의 폭 (full-res px)">Line width</label><input type="range" id="sigma" min="1" max="8" step="0.2"><output id="sigmaO"></output></div>
        <div class="row"><label for="L" title="이 길이 이상 이어진 선만 경계로 인정">Min line</label><input type="range" id="L" min="0" max="80" step="2"><output id="LO"></output></div>
        <div class="row"><label for="hi" title="이 값 이상이면 확실한 경계">Thr high</label><input type="range" id="hi" min="0.1" max="0.95" step="0.01"><output id="hiO"></output></div>
        <div class="row"><label for="lo" title="Thr high 경계에 이어진 경우만 경계로 인정">Thr low</label><input type="range" id="lo" min="0.02" max="0.9" step="0.01"><output id="loO"></output></div>
        <div class="row"><label for="h" title="클수록 grain을 덜 쪼갬">Split h</label><input type="range" id="h" min="0.5" max="20" step="0.5"><output id="hO"></output></div>
        <div class="row"><label for="merge" title="평균 경계 강도가 이 값보다 약하면 두 grain을 병합">Merge weak</label><input type="range" id="merge" min="0" max="0.6" step="0.01"><output id="mergeO"></output></div>
        <div class="row"><label for="brush">Brush</label><input type="range" id="brush" min="1" max="20" step="1"><output id="brushO"></output></div>
      </section>

      <section class="card">
        <h2>Grain size <span class="r" id="nlabel"></span><button class="btn" id="autoG" style="padding:3px 9px;font:500 11px var(--font-mono);letter-spacing:.04em" title="Bins, axis, Min ECD 자동 설정">AUTO</button></h2>
        <div class="row"><label for="minA">Min ECD</label><input type="range" id="minA" min="0" max="300" step="5"><output id="minAO"></output></div>
        <label class="chk"><input type="checkbox" id="edge" checked> ROI 경계에 닿은 grain 제외</label>
        <div class="kpis" id="kpis"></div>
        <div class="gt" id="gt" hidden></div>
        <div class="btns">
          <div class="seg" id="hmode" style="background:var(--bg);border-color:var(--line)">
            <button data-h="n">Number</button><button data-h="a">Area</button>
          </div>
          <div class="row" style="grid-template-columns:auto minmax(0,1fr) 28px;flex:1;min-width:150px"><label for="bins">Bins</label><input type="range" id="bins" min="6" max="40" step="1"><output id="binsO"></output></div>
        </div>
        <div class="axis"><label for="xmax">X max (µm)</label><input type="number" id="xmax" step="0.05" min="0.05" placeholder="auto"><label for="ymax">Y max (%)</label><input type="number" id="ymax" step="1" min="1" placeholder="auto"></div>
        <div class="chart"><canvas id="hist" data-h="230" style="height:230px"></canvas></div>
      </section>

      <section class="card">
        <h2>Compare <span class="r" style="text-transform:none"><span class="seg" id="cmode" style="background:var(--bg);border-color:var(--line)"><button data-c="bar">Bars</button><button data-c="cdf">CDF</button></span></span></h2>
        <div class="btns">
          <input type="text" id="tag" placeholder="Sample tag (예: 340 mJ · 800 shot)" style="flex:1;min-width:140px">
          <button class="btn pri" id="addCmp">Add</button>
        </div>
        <div class="tbl"><table class="cmp" id="cmpT"></table></div>
        <div class="chart" id="cdfWrap" hidden><canvas id="cdf" data-h="210" style="height:210px"></canvas></div>
      </section>

      <section class="card">
        <h2>Export</h2>
        <div class="btns">
          <button class="btn" id="exGrains">Grains CSV</button>
          <button class="btn" id="exSum">Summary CSV</button>
          <button class="btn" id="exPng">Overlay PNG</button>
          <button class="btn" id="exHist">Histogram PNG</button>
          <button class="btn" id="exCmp">Compare CSV</button>
        </div>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
<script>
// GrainBoundary core: valley/ridge detection -> line filter -> hysteresis -> EDT -> h-maxima markers -> seeded watershed -> merge -> stats
const GB = (() => {
  function downsample(src, W, H, f) {
    if (f === 1) return { img: Float32Array.from(src), W, H };
    const w = Math.floor(W / f), h = Math.floor(H / f), out = new Float32Array(w * h), n = f * f;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0;
      for (let j = 0; j < f; j++) { const r = (y * f + j) * W + x * f; for (let i = 0; i < f; i++) s += src[r + i]; }
      out[y * w + x] = s / n;
    }
    return { img: out, W: w, H: h };
  }

  function gauss(img, W, H, s) {
    if (s <= 0) return Float32Array.from(img);
    const r = Math.ceil(3 * s), k = new Float32Array(2 * r + 1); let ks = 0;
    for (let i = -r; i <= r; i++) { k[i + r] = Math.exp(-i * i / (2 * s * s)); ks += k[i + r]; }
    for (let i = 0; i < k.length; i++) k[i] /= ks;
    const tmp = new Float32Array(W * H), out = new Float32Array(W * H);
    for (let y = 0; y < H; y++) { const o = y * W;
      for (let x = 0; x < W; x++) { let a = 0;
        if (x >= r && x < W - r) for (let i = -r; i <= r; i++) a += k[i + r] * img[o + x + i];
        else for (let i = -r; i <= r; i++) { let xx = x + i; xx = xx < 0 ? -xx : xx >= W ? 2 * W - xx - 2 : xx; a += k[i + r] * img[o + xx]; }
        tmp[o + x] = a; } }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let a = 0;
      if (y >= r && y < H - r) for (let i = -r; i <= r; i++) a += k[i + r] * tmp[(y + i) * W + x];
      else for (let i = -r; i <= r; i++) { let yy = y + i; yy = yy < 0 ? -yy : yy >= H ? 2 * H - yy - 2 : yy; a += k[i + r] * tmp[yy * W + x]; }
      out[y * W + x] = a; }
    return out;
  }

  // Valley detector: Hessian gives the line normal; both sides along the normal must be brighter (dark line) or darker (bright line)
  // than the centre. Rejects one-sided edges such as rims of bright particles.
  function valley(img, W, H, scales, polarity, sSmooth) {
    const S = gauss(img, W, H, sSmooth), R = new Float32Array(W * H);
    const bil = (x, y) => { if (x < 0) x = 0; if (y < 0) y = 0; if (x > W - 1.001) x = W - 1.001; if (y > H - 1.001) y = H - 1.001;
      const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, p = y0 * W + x0;
      return (S[p] * (1 - fx) + S[p + 1] * fx) * (1 - fy) + (S[p + W] * (1 - fx) + S[p + W + 1] * fx) * fy; };
    const pols = polarity === 'both' ? ['dark', 'bright'] : [polarity];
    for (const s of scales) {
      const G = gauss(img, W, H, s), d = 2 * s;
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
        const p = y * W + x, c = G[p];
        const xx = G[p - 1] - 2 * c + G[p + 1], yy = G[p - W] - 2 * c + G[p + W];
        const xy = (G[p - W - 1] + G[p + W + 1] - G[p - W + 1] - G[p + W - 1]) / 4;
        const m = (xx + yy) / 2, dd = Math.sqrt((xx - yy) * (xx - yy) / 4 + xy * xy);
        for (const pl of pols) {
          const lam = pl === 'dark' ? m + dd : m - dd;
          if (pl === 'dark' ? lam <= 0 : lam >= 0) continue;
          let ex = xy, ey = lam - xx; if (Math.abs(ex) + Math.abs(ey) < 1e-9) { ex = lam - yy; ey = xy; }
          if (Math.abs(ex) + Math.abs(ey) < 1e-9) { ex = 1; ey = 0; }
          const nn = Math.hypot(ex, ey); ex /= nn; ey /= nn;
          const a = bil(x + ex * d, y + ey * d), b = bil(x - ex * d, y - ey * d), c0 = S[p];

$('hist').addEventListener('pointermove', e => { const g = histGeo; if (!g) return; const r = e.target.getBoundingClientRect(), x = e.clientX - r.left;
  const i = Math.floor((x - g.L) / g.pw * g.xmax / g.bw), tip = $('ctip'); if (i < 0 || i >= g.nb) { tip.hidden = true; return; }
  tip.hidden = false; tip.textContent = `${(i * g.bw).toFixed(3)}–${((i + 1) * g.bw).toFixed(3)} µm · ${g.val[i].toFixed(1)} % · n=${g.cnt[i]}`;

{ const t = document.createElement('div'); t.className = 'tip'; t.id = 'ctip'; t.hidden = true; $('hist').parentNode.appendChild(t); }

// compare
const SER = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];
$('addCmp').onclick = () => {
  if (!S.res || !S.res.sm.n) return toast('분석 결과가 없습니다.');
  const used = new Set(S.cmp.map(x => x.ci)); const ci = [...Array(8).keys()].find(i => !used.has(i));
  if (ci === undefined) return toast('비교는 최대 8개까지 가능합니다.');
  const tag = $('tag').value.trim() || S.name || `Sample ${S.cmpSeq + 1}`; S.cmpSeq++;
  S.cmp.push({ tag, ci, sm: S.res.sm, it: S.res.it, nmpx: S.nmpx, file: S.name, g: S.res.inc.map(g => [g.ecd, g.area]) }); $('tag').value = ''; renderCmp(); toast(`"${tag}" 추가되었습니다.`);
};
function renderCmp() {
  const t = $('cmpT');
  if (!S.cmp.length) { t.innerHTML = `<tr><td class="sub" style="text-align:left;white-space:normal">현재 결과를 tag와 함께 추가하면 조건별 분포를 비교할 수 있습니다.</td></tr>`; $('cdfWrap').hidden = true; return; }
  t.innerHTML = `<tr><th>Tag</th><th>N</th><th>Mean</th><th>D50</th><th>Lx/Ly</th><th></th></tr>` + S.cmp.map((s, i) =>
    `<tr><td><span class="chip" style="background:var(${SER[s.ci]})"></span>${esc(s.tag)}</td><td>${s.sm.n}</td><td>${s.sm.mean.toFixed(3)}</td><td>${s.sm.d50.toFixed(3)}</td><td>${(s.it.Lx / s.it.Ly).toFixed(2)}</td><td><button class="x" data-i="${i}" aria-label="삭제" title="삭제"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button></td></tr>`).join('');
  t.querySelectorAll('.x').forEach(b => b.onclick = () => { S.cmp.splice(+b.dataset.i, 1); renderCmp(); });
  $('cdfWrap').hidden = false; drawCdf();
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let cdfGeo = null;
function drawCdf() {
  if (!S.cmp.length) return; const cv = $('cdf'), { c, w, h } = setupCanvas(cv); c.clearRect(0, 0, w, h);
  const xmax0 = Math.max(...S.cmp.map(s => quant(s.sm.sorted, 0.99))) * 1.05, xs0 = niceStep(xmax0, 5), xmax = S.xmax || Math.ceil(xmax0 / xs0) * xs0;
  if (S.cmode === 'bar') {
    const nb = Math.max(6, Math.min(S.bins, 16)), bw = xmax / nb, sets = S.cmp.map(s => binVals(s.g, nb, bw));
    const ymax0 = Math.max(5, ...sets.flatMap(v => v.val)) * 1.1, ys = niceStep(ymax0, 4), ymax = Math.ceil(ymax0 / ys) * ys;
    const f = frame(c, w, h, xmax, ymax, S.hmode === 'n' ? 'Number fraction (%)' : 'Area fraction (%)', 'ECD (µm)'), base = f.Tp + f.ph, k = S.cmp.length;
    for (let i = 0; i < nb; i++) { const x0 = f.X(i * bw) + 1.5, x1 = f.X((i + 1) * bw) - 1.5, sw = (x1 - x0) / k;
      S.cmp.forEach((s, j) => bar(c, x0 + j * sw + (k > 1 ? 0.5 : 0), x0 + (j + 1) * sw - (k > 1 ? 0.5 : 0), f.Y(sets[j].val[i]), base, css(SER[s.ci]), f.Tp)); }
    cdfGeo = { mode: 'bar', L: f.L, pw: f.pw, xmax, nb, bw, sets };
    return;
  }
  const f = frame(c, w, h, xmax, 100, 'Cumulative number (%)', 'ECD (µm)');
  for (const s of S.cmp) { const e = s.sm.sorted, n = e.length; c.strokeStyle = css(SER[s.ci]); c.lineWidth = 2; c.beginPath(); c.moveTo(f.X(0), f.Y(0));
    e.forEach((v, i) => { c.lineTo(f.X(Math.min(v, xmax)), f.Y(100 * i / n)); c.lineTo(f.X(Math.min(v, xmax)), f.Y(100 * (i + 1) / n)); }); c.lineTo(f.X(xmax), f.Y(100)); c.stroke(); }
  cdfGeo = { mode: 'cdf', L: f.L, pw: f.pw, xmax };
}
$('cdf').addEventListener('pointermove', e => { const g = cdfGeo; if (!g) return; const r = e.target.getBoundingClientRect(), x = e.clientX - r.left, v = (x - g.L) / g.pw * g.xmax, tip = $('dtip');
  if (v < 0 || v > g.xmax) { tip.hidden = true; return; } tip.hidden = false;
  if (g.mode === 'bar') { const i = Math.min(g.nb - 1, Math.floor(v / g.bw));
    tip.innerHTML = `${(i * g.bw).toFixed(3)}–${((i + 1) * g.bw).toFixed(3)} µm<br>` + S.cmp.map((s, j) => `<span class="chip" style="background:var(${SER[s.ci]})"></span>${esc(s.tag)} ${g.sets[j].val[i].toFixed(1)} %`).join('<br>'); }
  else tip.innerHTML = `ECD ≤ ${v.toFixed(3)} µm<br>` + S.cmp.map(s => { const e = s.sm.sorted; let k = 0; while (k < e.length && e[k] <= v) k++; return `<span class="chip" style="background:var(${SER[s.ci]})"></span>${esc(s.tag)} ${(100 * k / e.length).toFixed(0)} %`; }).join('<br>');
  tip.style.left = Math.max(0, Math.min(x + 12, r.width - tip.offsetWidth)) + 'px'; tip.style.top = '10px'; });
$('cdf').addEventListener('pointerleave', () => $('dtip').hidden = true);
{ const t = document.createElement('div'); t.className = 'tip'; t.id = 'dtip'; t.hidden = true; $('cdf').parentNode.appendChild(t); }

// ---------------- export ----------------
let dl = null; (async () => { try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; } })();
async function save(filename, data) {

  const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stem = () => (S.name || 'sem').replace(/\.[^.]+$/, '');
const csv = rows => '﻿' + rows.map(r => r.map(v => typeof v === 'string' && /[,"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v).join(',')).join('\n');
const paramRows = () => [['file', S.name], ['pixel_nm', S.nmpx], ['working_scale', S.p.f], ['gb_type', S.p.mode], ['polarity', S.p.pol], ['line_sigma_px', S.p.sigma], ['line_filter_px', S.p.L], ['thr_high', S.p.hi], ['thr_low', S.p.lo], ['seed_h_px', S.p.h], ['merge_weak', S.p.merge], ['min_ecd_nm', S.minEcd], ['exclude_edge', S.edge], ['roi_px', `${S.roi.x0} ${S.roi.y0} ${S.roi.x1} ${S.roi.y1}`], ['manual_edits', S.edits.length]];
$('exGrains').onclick = () => { if (!S.res) return; const f = S.p.f;
  save(stem() + '_grains.csv', csv([['id', 'area_um2', 'ECD_um', 'major_um', 'minor_um', 'aspect_ratio', 'angle_deg', 'cx_px', 'cy_px', 'touches_roi_edge', 'included'],
    ...S.res.all.map(g => [g.id, g.area.toFixed(6), g.ecd.toFixed(5), g.major.toFixed(5), g.minor.toFixed(5), g.ar.toFixed(3), g.angle.toFixed(1), (g.cx * f).toFixed(1), (g.cy * f).toFixed(1), g.edge ? 1 : 0, g.inc ? 1 : 0])])); };
$('exSum').onclick = () => { if (!S.res) return; const { sm, it } = S.res;
  save(stem() + '_summary.csv', csv([['metric', 'value'], ['N_grains', sm.n], ['mean_ECD_um', sm.mean], ['sd_ECD_um', sm.sd], ['D10_um', sm.d10], ['D50_um', sm.d50], ['D90_um', sm.d90], ['area_weighted_ECD_um', sm.aw], ['mean_aspect_ratio', sm.ar], ['intercept_Lx_um', it.Lx], ['intercept_Ly_um', it.Ly], ['Lx_over_Ly', it.Lx / it.Ly], ...paramRows()])); };
$('exCmp').onclick = () => { if (!S.cmp.length) return toast('비교 목록이 비어 있습니다.');
  save('grain_compare.csv', csv([['tag', 'file', 'pixel_nm', 'N', 'mean_ECD_um', 'sd_um', 'D10_um', 'D50_um', 'D90_um', 'area_weighted_ECD_um', 'mean_AR', 'Lx_um', 'Ly_um'],
    ...S.cmp.map(s => [s.tag, s.file, s.nmpx, s.sm.n, s.sm.mean, s.sm.sd, s.sm.d10, s.sm.d50, s.sm.d90, s.sm.aw, s.sm.ar, s.it.Lx, s.it.Ly])])); };
$('exPng').onclick = () => { if (!S.base) return; const cv = document.createElement('canvas'); cv.width = S.W0; cv.height = S.H0; const c = cv.getContext('2d'), f = S.p.f;
  c.drawImage(S.base, 0, 0); c.imageSmoothingEnabled = false; if (S.view === 'grains' && ovG) { c.globalAlpha = .5; c.drawImage(ovG, 0, 0, S.W0, S.H0); c.globalAlpha = 1; } if (ovB) c.drawImage(ovB, 0, 0, ovB.width * f, ovB.height * f);
  cv.toBlob(b => save(stem() + '_gb_overlay.png', b), 'image/png'); };
$('exHist').onclick = () => { const cv = $('hist'), o = document.createElement('canvas'); o.width = cv.width; o.height = cv.height; const c = o.getContext('2d'); c.fillStyle = css('--panel'); c.fillRect(0, 0, o.width, o.height); c.drawImage(cv, 0, 0); o.toBlob(b => save(stem() + '_ecd_hist.png', b), 'image/png'); };
