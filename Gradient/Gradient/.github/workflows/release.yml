name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Gradient.app
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent build/Gradient.app Gradient-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gradient-macOS
          path: Gradient-macOS.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Gradient-macOS.zip
          generate_release_notes: true
